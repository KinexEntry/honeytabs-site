title: Page not found | HoneyTabs
desc: That page flew off. Head back to the HoneyTabs homepage.
path: /404.html
out: 404.html
robots: noindex
---
<script>
// Referral links: honeytabs.com/r/<code> has no file on GitHub Pages, so it lands here. Send it to /r/?code=<code>.
(function () {
  var m = location.pathname.match(/^\/r\/([A-Za-z0-9-]{4,20})\/?$/);
  if (m) location.replace('/r/?code=' + encodeURIComponent(m[1].toUpperCase()));
})();
</script>
<main id="main">
<section class="page-hero" style="border:0;padding:6rem 0 7rem;text-align:center">
  <div class="wrap">
    <img src="/assets/img/honeytabs-mark.svg" alt="" width="120" height="120" style="margin:0 auto 1.5rem;width:120px;height:auto">
    <h1>This page flew off</h1>
    <p style="margin:0 auto 2rem">We couldn't find what you were looking for. Let's get you back to the hive.</p>
    <a class="btn" href="/">Back to the homepage {{icon:arrow}}</a>
  </div>
</section>
</main>
